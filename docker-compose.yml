services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: fintrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRE_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-fintrack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRE_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: fintrack_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Web Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: fintrack-app:latest
    container_name: fintrack_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=FinTrack
      - API_V1_STR=/api/v1
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_NAME=${DATABASE_NAME:-fintrack}
      - POSTGRE_HOST=db
      - POSTGRE_PORT=5432
      - POSTGRE_USER=${POSTGRE_USER:-postgres}
      - POSTGRE_PASSWORD=${POSTGRE_PASSWORD:-postgres}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-dev-key-change-in-prod-minimum32chars}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000", "http://localhost:5173", "http://127.0.0.1:5173"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/healthz\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # 4. Celery Worker (reuses the built image)
  worker:
    image: fintrack-app:latest
    container_name: fintrack_worker
    restart: unless-stopped
    environment:
      - PROJECT_NAME=FinTrack
      - API_V1_STR=/api/v1
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_NAME=${DATABASE_NAME:-fintrack}
      - POSTGRE_HOST=db
      - POSTGRE_PORT=5432
      - POSTGRE_USER=${POSTGRE_USER:-postgres}
      - POSTGRE_PASSWORD=${POSTGRE_PASSWORD:-postgres}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-dev-key-change-in-prod-minimum32chars}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000", "http://localhost:5173", "http://127.0.0.1:5173"]
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info

volumes:
  postgres_data: