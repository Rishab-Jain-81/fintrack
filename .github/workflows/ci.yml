name: FinTrack CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: fintrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PROJECT_NAME: FinTrack Test
      API_V1_STR: /api/v1
      DATABASE_NAME: fintrack_test
      POSTGRE_HOST: localhost
      POSTGRE_PORT: 5432
      POSTGRE_USER: postgres
      POSTGRE_PASSWORD: postgres_password
      JWT_SECRET_KEY: super-secret-ci-testing-key-minimum-32-chars!
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      ENVIRONMENT: test
      DEBUG: "true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          uv sync --all-extras --dev

      - name: Execute Automated Test Suite (pytest)
        working-directory: ./backend
        run: |
          uv run pytest -v

  docker-build:
    name: Test Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: fintrack-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max